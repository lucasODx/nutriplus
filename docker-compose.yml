services:
  controle_nutricional:
    build:
      context: ./controle_nutricional
      dockerfile: ./Dockerfile
    container_name: controle_nutricional
    hostname: controle_nutricional
    restart: always
    volumes:
      - ./controle_nutricional:/service
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - postgres-db
    networks:
      rede-nutriplus:
        aliases:
          - controle-nutricional

  tabela_nutricional:
    build:
      context: ./tabela_nutricional
      dockerfile: ./Dockerfile
    container_name: tabela_nutricional
    hostname: tabela_nutricional
    restart: always
    volumes:
      - ./tabela_nutricional:/service
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - postgres-db
    networks:
      rede-nutriplus:
        aliases:
          - tabela-nutricional

  pratica_nutricional:
    build:
      context: ./pratica_nutricional
      dockerfile: ./Dockerfile
    container_name: pratica_nutricional
    hostname: pratica_nutricional
    restart: always
    volumes:
      - ./pratica_nutricional:/service
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - postgres-db
    networks:
      rede-nutriplus:
        aliases:
          - pratica-nutricional

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations.sql:/docker-entrypoint-initdb.d/migrations.sql
    networks:
      - rede-nutriplus

volumes:
  pgdata:

networks:
  rede-nutriplus: 
    external: true 